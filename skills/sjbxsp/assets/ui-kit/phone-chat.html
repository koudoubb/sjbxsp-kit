<!DOCTYPE html>
<!-- 手机 Web 对话骨架：讲"随时随地改 / 一条消息就改完"这类场景用。
     尺寸 = 卡片槽位尺寸（示例 330×594，比表单页窄，字号下限也低一档）。
     缩略图是占位块，换成项目里的成片帧：<div class="thumb"><img src="../shots/xxx.png"></div>
     注意：不要画成第三方聊天软件原样（头像/输入框/表情栏全抄），会变成界面仿冒。
     只保留：地址栏 + 会话头 + 两条气泡 + 系统记录条 + 输入栏。 -->
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  html,body{width:330px;height:594px}
  .phone{width:330px;height:594px;display:flex;flex-direction:column;background:var(--cream)}

  .head{background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
  .head .top{display:flex;justify-content:space-between;align-items:center;padding:2px 14px 0}
  .head .title{display:flex;align-items:center;gap:9px;padding:4px 14px 11px}
  .head .av{width:34px;height:34px;border-radius:11px;background:var(--coral);
    color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .head .nm{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
  .head .st{font-size:12px;color:var(--mint);font-weight:700;margin-top:2px;display:flex;align-items:center;gap:4px}
  .head .st:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--mint)}
  .head .more{color:#B9B2C4;font-size:18px;letter-spacing:1px}

  .chat{flex:1;padding:11px 11px 0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
  .day{align-self:center;font-size:11px;color:var(--mute);font-weight:700;
    background:#EDEAEF;border-radius:7px;padding:3px 10px}

  .msg{display:flex;gap:7px}
  .msg .bub{border-radius:14px;padding:9px 11px;font-size:16px;line-height:1.46;font-weight:600}
  .msg.u{justify-content:flex-end}
  .msg.u .bub{background:var(--coral);color:#fff;border-bottom-right-radius:5px;max-width:84%}
  .msg.a .bub{background:#fff;color:var(--ink);border-bottom-left-radius:5px;max-width:90%;
    box-shadow:0 1px 3px rgba(80,60,95,.07)}
  .msg .mini{width:28px;height:28px;border-radius:9px;background:var(--coral);
    color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .thumb{margin-top:8px;border-radius:9px;overflow:hidden;border:1px solid var(--line);height:110px;
    display:flex;align-items:center;justify-content:center;background:#F6F2EE;color:var(--mute);
    font-size:12px;font-weight:700}
  .thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 32%}
  .okline{margin-top:7px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:var(--mint)}
  .okline:before{content:'✓';width:15px;height:15px;border-radius:50%;background:var(--mint);color:#fff;
    font-size:9px;display:flex;align-items:center;justify-content:center}

  .sys{align-self:center;font-size:11.5px;color:var(--ink2);font-weight:700;background:#fff;
    border:1px solid var(--line);border-radius:9px;padding:5px 11px;margin-top:2px}
  .sys b{color:var(--coral);font-weight:800}

  .inputbar{background:#fff;border-top:1px solid var(--line);padding:8px 11px 11px;
    display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .inputbar .f{flex:1;height:38px;border-radius:19px;background:#F3EFF5;display:flex;align-items:center;
    padding:0 13px;font-size:14px;color:var(--mute);font-weight:600}
  .inputbar .send{width:38px;height:38px;border-radius:50%;background:var(--coral);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
</style></head>
<body>
<div class="phone">
  <div class="head">
    <div class="statusbar">
      <span>9:41</span><span class="ic"><i class="dot"></i><i class="dot"></i><i class="bat"></i></span>
    </div>
    <div class="urlbar">
      <div class="urlpill"><i class="lock"></i>your-domain.com</div>
    </div>
    <div class="title">
      <div class="av">AI</div>
      <div style="flex:1">
        <div class="nm">视频制作 · B-1042</div>
        <div class="st">任务运行中</div>
      </div>
      <div class="more">···</div>
    </div>
  </div>

  <div class="chat">
    <div class="day">今天 14:06</div>

    <div class="msg u"><div class="bub">第 3 镜的颜色换成粉色，今晚 8 点前要</div></div>

    <div class="msg a">
      <div class="mini">AI</div>
      <div class="bub">
        收到，第 3 镜已按新颜色重生成，其余镜头不动。
        <div class="thumb">成片缩略图</div>
        <div class="okline">预览已更新 · 1 分 40 秒出片</div>
      </div>
    </div>

    <div class="sys">已记录到 <b>B-1042</b> · 修改第 1 次</div>
  </div>

  <div class="inputbar">
    <div class="f">发消息，随时改…</div>
    <div class="send">↑</div>
  </div>
</div>
</body></html>
