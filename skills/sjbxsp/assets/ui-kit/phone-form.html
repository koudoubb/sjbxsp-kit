<!DOCTYPE html>
<!-- 手机 Web 表单骨架：改文案即可用。尺寸 = 卡片槽位尺寸（示例 400×535）。
     两张缩略图是占位块，换成项目里的图片：<div class="th"><img src="../shots/xxx.png"></div> -->
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  /* 设计宽度 = 卡片里的最终显示宽度；字号按“缩到 1080 竖屏仍能读”放大 */
  html,body{width:400px;height:535px}
  .phone{width:400px;height:535px;display:flex;flex-direction:column}

  .hero{background:linear-gradient(150deg,#FF8A5B 0%,#FF5E6C 52%,#F0437E 100%);color:#fff;
    padding-bottom:11px}
  .hero .top{display:flex;justify-content:space-between;align-items:flex-start;padding:1px 15px 0}
  .hero .badge{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);
    border-radius:9px;padding:5px 9px;font-size:14px;font-weight:800;letter-spacing:.01em;margin-top:2px}
  .hero h1{font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.18}
  .hero p{font-size:14px;opacity:.9;margin-top:6px;font-weight:600;letter-spacing:.01em}

  .body{flex:1;padding:10px 15px 0;background:#FFFBF7}
  .flab{font-size:15px;font-weight:800;color:#4E4560;margin-bottom:6px;
    display:flex;align-items:center;gap:6px}
  .flab b{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#FFEDE6;
    color:var(--coral);align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}

  .styles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
  .st{border:1.5px solid var(--line);border-radius:13px;padding:7px 8px;background:#fff;
    display:flex;gap:7px;align-items:center;position:relative;height:52px}
  .st .em{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:17px;background:#FFF0E8;flex:0 0 auto}
  .st .nm{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
  .st .ds{font-size:11px;color:var(--mute);margin-top:2px;font-weight:600}
  .st.on{border-color:var(--coral);border-width:2px;background:#FFF9F6;box-shadow:0 4px 12px rgba(255,106,69,.14)}
  .st.on:after{content:'';position:absolute;right:-1px;top:-1px;width:18px;height:18px;
    background:var(--coral);border-radius:0 12px 0 12px}
  .st .tick{position:absolute;right:0;top:-1px;color:#fff;font-size:10px;font-weight:900;z-index:2}

  .up{border:1.6px dashed #F0C3B4;border-radius:13px;background:#FFF8F4;
    padding:7px;display:flex;align-items:center;gap:8px;margin-bottom:9px;height:58px}
  .up .th{width:46px;height:46px;border-radius:9px;overflow:hidden;border:1.5px solid #fff;
    box-shadow:0 2px 6px rgba(120,70,50,.14);flex:0 0 auto}
  .up .th img{width:100%;height:100%;object-fit:cover;display:block}
  .up .th.ph{display:flex;align-items:center;justify-content:center;font-size:11px;
    color:#C98B72;background:#FFEFE6;font-weight:700}
  .up .add{width:46px;height:46px;border-radius:9px;border:1.4px dashed #E3B2A0;background:#fff;
    display:flex;align-items:center;justify-content:center;color:#D0805F;font-size:20px;font-weight:300;flex:0 0 auto}
  .up .hint{font-size:11.5px;color:var(--mute);line-height:1.4;font-weight:600;margin-left:2px}
  .up .hint b{display:block;color:#4E4560;font-size:14px;font-weight:800;margin-bottom:2px}

  .inp{height:36px;margin-bottom:9px;font-size:18px}
  .ta{height:40px;border:1.5px solid var(--line);border-radius:12px;background:#fff;
    padding:7px 11px;font-size:15px;font-weight:600;color:#4E4560;line-height:1.4}

  .cta{position:absolute;left:0;right:0;bottom:0;padding:6px 15px 11px;
    background:linear-gradient(180deg,rgba(255,251,247,0) 0%,#FFFBF7 30%)}
  .btn{height:46px;border-radius:14px;background:linear-gradient(100deg,#FF7A45,#FF4E7A);
    color:#fff;font-size:18px;font-weight:800;letter-spacing:.02em;
    display:flex;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 8px 20px rgba(255,78,122,.3)}
  .btn span{font-size:14px;font-weight:700;opacity:.88}
</style></head>
<body>
<div class="phone">
  <div class="hero">
    <div class="statusbar" style="color:#fff">
      <span>9:41</span><span class="ic"><i class="dot"></i><i class="dot"></i><i class="bat"></i></span>
    </div>
    <div class="urlbar">
      <div class="urlpill"><i class="lock"></i>xiaoxing-birthday.party</div>
    </div>
    <div class="top">
      <div>
        <h1>小星的生日故事</h1>
        <p>3 分钟填完 · 24 小时交付</p>
      </div>
      <div class="badge">¥30 / 条</div>
    </div>
  </div>

  <div class="body">
    <div class="flab"><b>1</b>选一个故事风格</div>
    <div class="styles">
      <div class="st on"><span class="tick">✓</span><div class="em">🦕</div><div><div class="nm">恐龙世界</div><div class="ds">画作变实景</div></div></div>
      <div class="st"><div class="em">🚀</div><div><div class="nm">太空冒险</div><div class="ds">星际生日会</div></div></div>
    </div>

    <div class="flab"><b>2</b>上传照片和画作</div>
    <div class="up">
      <div class="th ph">画作</div>
      <div class="th ph">照片</div>
      <div class="add">＋</div>
      <div class="hint"><b>已选 2 张</b>画作请拍正、光线均匀</div>
    </div>

    <div class="flab"><b>3</b>孩子的小名</div>
    <div class="inp">小星<i class="cursor"></i></div>

    <div class="flab"><b>4</b>想对她说的一句祝福</div>
    <div class="ta">愿你每天都像今天一样，被爱围着长大。</div>
  </div>

  <div class="cta"><div class="btn">提交订单<span>· ¥30</span></div></div>
</div>
</body></html>
